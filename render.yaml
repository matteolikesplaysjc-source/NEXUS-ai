services:
  - type: web
    name: nexus-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: NEXUS_SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
